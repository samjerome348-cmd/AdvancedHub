<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADVANCEDHUB // Elite Trading Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@300;400;600;700;900&display=swap');
    
    body { 
      background: radial-gradient(circle at top right, #0d1322, #06080e); 
      color: #e2e8f0; 
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .neon-green { color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .neon-red { color: #ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.3); }
    .glass-card { 
      background: linear-gradient(135deg, rgba(18, 24, 38, 0.85), rgba(10, 14, 23, 0.95)); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card:hover { border-color: rgba(0, 255, 136, 0.2); }
    .input-field { 
      background-color: rgba(6, 8, 14, 0.8); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      color: white; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .input-field:focus { border-color: #00ff88; outline: none; box-shadow: 0 0 8px rgba(0,255,136,0.3); }
    .glow-btn {
      background: linear-gradient(135deg, #00ff88, #00b862);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
      transition: all 0.2s ease;
    }
    .glow-btn:hover { box-shadow: 0 0 25px rgba(0, 255, 136, 0.7); transform: translateY(-1px); }
  </style>
</head>
<body class="p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://uydgnqqmkmoemmyrorbg.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_IaI9Dt8lIL2m2-cIrq9Gug_NdeWchok"; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [session, setSession] = React.useState(null);
      const [authMode, setAuthMode] = React.useState('login'); // 'login', 'signup', 'forgot'
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [authError, setAuthError] = React.useState('');
      const [authMsg, setAuthMsg] = React.useState('');

      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [selectedAccountFilter, setSelectedAccountFilter] = React.useState('ALL');
      const [trades, setTrades] = React.useState([]);
      const [expenses, setExpenses] = React.useState([]);

      // Calendar state
      const [calendarDate, setCalendarDate] = React.useState(new Date());

      // Daily Journal state
      const [journalDate, setJournalDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [marketNotes, setMarketNotes] = React.useState('');
      const [personalNotes, setPersonalNotes] = React.useState('');

      // Form Data
      const [formData, setFormData] = React.useState({ 
        date: new Date().toISOString().split('T')[0],
        symbol: 'NQ', assetClass: 'Futures', accountType: 'Funded', entry: '', exit: '', size: '', type: 'BUY', 
        pnl: '', setup: 'Onion play', emotion: 'Focus', mistake: 'None', chartUrl: ''
      });

      // Expense Form Data
      const [expenseForm, setExpenseForm] = React.useState({
        date: new Date().toISOString().split('T')[0],
        firmName: 'Apex Trader Funding', accountSize: '50K', cost: '', status: 'Active'
      });

      const winLossChartRef = React.useRef(null);
      const equityChartRef = React.useRef(null);
      const winLossChartInstance = React.useRef(null);
      const equityChartInstance = React.useRef(null);

      React.useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) {
            fetchUserTrades(session.user.id);
            fetchExpenses(session.user.id);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) {
            fetchUserTrades(session.user.id);
            fetchExpenses(session.user.id);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      React.useEffect(() => {
        if (session) fetchJournalEntry(journalDate);
      }, [journalDate, session]);

      const fetchUserTrades = async (userId) => {
        const { data, error } = await supabase
          .from('trades')
          .select('*')
          .eq('user_id', userId)
          .order('id', { ascending: true });

        if (!error && data) setTrades(data);
      };

      const fetchExpenses = async (userId) => {
        const { data, error } = await supabase
          .from('account_expenses')
          .select('*')
          .eq('user_id', userId)
          .order('date', { ascending: false });

        if (!error && data) setExpenses(data);
      };

      const fetchJournalEntry = async (dateStr) => {
        const { data } = await supabase
          .from('journal_entries')
          .select('*')
          .eq('user_id', session.user.id)
          .eq('date', dateStr)
          .maybeSingle();

        if (data) {
          setMarketNotes(data.market_notes || '');
          setPersonalNotes(data.personal_notes || '');
        } else {
          setMarketNotes('');
          setPersonalNotes('');
        }
      };

      const saveJournalEntry = async () => {
        const { error } = await supabase.from('journal_entries').upsert({
          user_id: session.user.id,
          date: journalDate,
          market_notes: marketNotes,
          personal_notes: personalNotes
        }, { onConflict: 'user_id,date' });

        if (!error) alert("Journal entry saved for " + journalDate);
        else alert("Error saving journal: " + error.message);
      };

      const handleDeleteTrade = async (tradeId) => {
        if (window.confirm("Are you sure you want to delete this trade execution?")) {
          const { error } = await supabase.from('trades').delete().eq('id', tradeId);
          if (!error) fetchUserTrades(session.user.id);
          else alert("Error deleting trade: " + error.message);
        }
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const newExpense = {
          user_id: session.user.id,
          date: expenseForm.date,
          firm_name: expenseForm.firmName,
          account_size: expenseForm.accountSize,
          cost: parseFloat(expenseForm.cost || 0),
          status: expenseForm.status
        };

        const { error } = await supabase.from('account_expenses').insert([newExpense]);
        if (!error) {
          setExpenseForm({ date: new Date().toISOString().split('T')[0], firmName: 'Apex Trader Funding', accountSize: '50K', cost: '', status: 'Active' });
          fetchExpenses(session.user.id);
        } else alert("Error saving expense: " + error.message);
      };

      const handleDeleteExpense = async (id) => {
        const { error } = await supabase.from('account_expenses').delete().eq('id', id);
        if (!error) fetchExpenses(session.user.id);
      };

      // Filtered Trades based on selected account option
      const filteredTrades = React.useMemo(() => {
        if (selectedAccountFilter === 'ALL') return trades;
        return trades.filter(t => (t.account_type || 'Live') === selectedAccountFilter);
      }, [trades, selectedAccountFilter]);

      // Charting Logic
      React.useEffect(() => {
        if (activeTab === 'dashboard' && session && filteredTrades.length > 0) {
          if (winLossChartRef.current) {
            if (winLossChartInstance.current) winLossChartInstance.current.destroy();
            const wins = filteredTrades.filter(t => Number(t.pnl) > 0).length;
            const losses = filteredTrades.filter(t => Number(t.pnl) < 0).length;
            const breakevens = filteredTrades.filter(t => Number(t.pnl) === 0).length;

            winLossChartInstance.current = new Chart(winLossChartRef.current, {
              type: 'doughnut',
              data: {
                labels: ['Wins', 'Losses', 'Breakeven'],
                datasets: [{
                  data: [wins, losses, breakevens],
                  backgroundColor: ['#00ff88', '#ff3366', '#64748b'],
                  borderWidth: 0
                }]
              },
              options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } }
            });
          }

          if (equityChartRef.current) {
            if (equityChartInstance.current) equityChartInstance.current.destroy();
            let runningTotal = 0;
            const equityData = filteredTrades.map(t => {
              runningTotal += Number(t.pnl || 0);
              return runningTotal;
            });

            equityChartInstance.current = new Chart(equityChartRef.current, {
              type: 'line',
              data: {
                labels: filteredTrades.map((_, i) => `#${i + 1}`),
                datasets: [{
                  label: 'Cumulative P&L ($)',
                  data: equityData,
                  borderColor: '#00ff88',
                  backgroundColor: 'rgba(0, 255, 136, 0.05)',
                  fill: true,
                  tension: 0.3
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                  y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                plugins: { legend: { display: false } }
              }
            });
          }
        }
      }, [filteredTrades, activeTab, session]);

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthMsg('');

        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthError(error.message);
        } else if (authMode === 'signup') {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setAuthError(error.message);
          else setAuthMsg("Account created! Check your email to confirm registration.");
        } else if (authMode === 'forgot') {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.href,
          });
          if (error) setAuthError(error.message);
          else setAuthMsg("Password reset email sent! Check your inbox.");
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setTrades([]);
      };

      // Handle Direct Clipboard Image Paste (Ctrl+V)
      const handleImagePaste = (e) => {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            const file = items[i].getAsFile();
            const reader = new FileReader();
            reader.onload = (event) => {
              setFormData(prev => ({ ...prev, chartUrl: event.target.result }));
            };
            reader.readAsDataURL(file);
          }
        }
      };

      // Handle Direct Image File Selection (Local Photo Upload)
      const handleImageFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setFormData(prev => ({ ...prev, chartUrl: event.target.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!session) return;

        let calculatedPnl = formData.pnl;
        if (!calculatedPnl && formData.entry && formData.exit && formData.size) {
          const entry = parseFloat(formData.entry);
          const exit = parseFloat(formData.exit);
          const size = parseFloat(formData.size);
          calculatedPnl = (formData.type === 'CALL' || formData.type === 'BUY') 
            ? ((exit - entry) * size).toFixed(2) 
            : ((entry - exit) * size).toFixed(2);
        }

        const newTrade = { 
          date: formData.date,
          symbol: formData.symbol,
          entry: formData.entry ? parseFloat(formData.entry) : null,
          exit: formData.exit ? parseFloat(formData.exit) : null,
          size: formData.size ? parseFloat(formData.size) : null,
          type: formData.type,
          pnl: parseFloat(calculatedPnl || 0),
          setup: formData.setup,
          emotion: formData.emotion,
          account_type: formData.accountType,
          user_id: session.user.id 
        };

        const { error } = await supabase.from('trades').insert([newTrade]);
        if (!error) {
          setFormData({ 
            date: new Date().toISOString().split('T')[0],
            symbol: 'NQ', assetClass: 'Futures', accountType: 'Funded', entry: '', exit: '', size: '', type: 'BUY', 
            pnl: '', setup: 'Onion play', emotion: 'Focus', mistake: 'None', chartUrl: ''
          });
          fetchUserTrades(session.user.id);
        } else alert("Error saving trade: " + error.message);
      };

      // Export CSV
      const exportCSV = () => {
        if (filteredTrades.length === 0) return alert("No trades to export.");
        const headers = ["Date", "Account", "Symbol", "Type", "Entry", "Exit", "Size", "Setup", "P&L"];
        const rows = filteredTrades.map(t => [
          t.date, t.account_type || 'Live', t.symbol, t.type, t.entry, t.exit, t.size, t.setup, t.pnl
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `trading_journal_${selectedAccountFilter}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Import CSV
      const importCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const text = event.target.result;
          const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length < 2) return alert("Invalid CSV format.");

          const newTrades = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",");
            if (cols.length >= 8) {
              newTrades.push({
                date: cols[0],
                account_type: cols[1] || 'Live',
                symbol: cols[2],
                type: cols[3],
                entry: parseFloat(cols[4]) || 0,
                exit: parseFloat(cols[5]) || 0,
                size: parseFloat(cols[6]) || 0,
                setup: cols[7] || 'Onion play',
                pnl: parseFloat(cols[8]) || 0,
                user_id: session.user.id
              });
            }
          }

          if (newTrades.length > 0) {
            const { error } = await supabase.from('trades').insert(newTrades);
            if (!error) {
              alert(`Successfully imported ${newTrades.length} trades!`);
              fetchUserTrades(session.user.id);
            } else alert("Import failed: " + error.message);
          }
        };
        reader.readAsText(file);
      };

      // Analytics
      const totalPnl = filteredTrades.reduce((acc, t) => acc + Number(t.pnl || 0), 0);
      const winsList = filteredTrades.filter(t => Number(t.pnl) > 0);
      const lossesList = filteredTrades.filter(t => Number(t.pnl) < 0);
      
      const totalWinDollar = winsList.reduce((acc, t) => acc + Number(t.pnl), 0);
      const totalLossDollar = Math.abs(lossesList.reduce((acc, t) => acc + Number(t.pnl), 0));

      const profitFactor = totalLossDollar > 0 ? (totalWinDollar / totalLossDollar).toFixed(2) : totalWinDollar > 0 ? '∞' : '0.00';
      const winRate = filteredTrades.length > 0 ? Math.round((winsList.length / filteredTrades.length) * 100) : 0;

      // Calendar Data Calculation
      const renderCalendarDays = () => {
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const tradesByDate = {};
        filteredTrades.forEach(t => {
          if (!t.date) return;
          if (!tradesByDate[t.date]) tradesByDate[t.date] = { count: 0, pnl: 0 };
          tradesByDate[t.date].count += 1;
          tradesByDate[t.date].pnl += Number(t.pnl || 0);
        });

        const cells = [];
        for (let i = 0; i < firstDay; i++) {
          cells.push(<div key={`empty-${i}`} className="h-24 bg-black/20 rounded-lg border border-gray-900"></div>);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dayData = tradesByDate[dateStr];

          cells.push(
            <div key={day} className={`h-24 p-2 rounded-lg border flex flex-col justify-between transition-all ${dayData ? (dayData.pnl >= 0 ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-red-500/10 border-red-500/30') : 'bg-black/40 border-gray-800'}`}>
              <div className="flex justify-between items-center text-xs font-bold">
                <span className="text-gray-400">{day}</span>
                {dayData && (
                  <span className="px-1.5 py-0.5 rounded text-[10px] bg-gray-800 font-mono text-gray-300">
                    {dayData.count} {dayData.count === 1 ? 'trade' : 'trades'}
                  </span>
                )}
              </div>
              {dayData ? (
                <div className={`text-sm font-black mono text-right ${dayData.pnl >= 0 ? 'neon-green' : 'neon-red'}`}>
                  ${dayData.pnl.toFixed(2)}
                </div>
              ) : (
                <div className="text-[10px] text-gray-600 text-right font-mono">-</div>
              )}
            </div>
          );
        }
        return cells;
      };

      // Weekly PnL calculation & Green/Red week breakdown
      const calculateWeeklyBreakdown = () => {
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        
        const weeks = [0, 0, 0, 0, 0];

        filteredTrades.forEach(t => {
          if (!t.date) return;
          const [dYear, dMonth, dDay] = t.date.split('-').map(Number);
          if (dYear === year && dMonth === month + 1) {
            const weekIdx = Math.min(Math.floor((dDay - 1) / 7), 4);
            weeks[weekIdx] += Number(t.pnl || 0);
          }
        });

        const greenWeeks = weeks.filter(w => w > 0).length;
        const redWeeks = weeks.filter(w => w < 0).length;

        return { weeks, greenWeeks, redWeeks };
      };

      if (!session) {
        return (
          <div className="max-w-md mx-auto mt-16 glass-card p-8 rounded-2xl border border-emerald-500/20 space-y-6">
            <div className="text-center space-y-2">
              <div className="inline-block p-3 bg-emerald-500/10 rounded-full border border-emerald-500/30 mb-2">
                <span className="text-3xl">⚡</span>
              </div>
              <h1 className="text-3xl font-black tracking-wider text-white">ADVANCED<span className="neon-green">HUB</span></h1>
              <p className="text-xs text-gray-400 tracking-widest uppercase">Institutional Performance Terminal</p>
            </div>

            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="text-xs text-gray-400 font-semibold block mb-1">TRADER EMAIL</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="input-field w-full py-2.5" placeholder="trader@terminal.com" required />
              </div>
              
              {authMode !== 'forgot' && (
                <div>
                  <label className="text-xs text-gray-400 font-semibold block mb-1">PASSWORD</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="input-field w-full py-2.5" placeholder="••••••••••••" required={authMode !== 'forgot'} />
                </div>
              )}

              {authError && <p className="text-xs text-red-400 font-mono bg-red-500/10 p-2 rounded border border-red-500/20">{authError}</p>}
              {authMsg && <p className="text-xs text-emerald-400 font-mono bg-emerald-500/10 p-2 rounded border border-emerald-500/20">{authMsg}</p>}

              <button type="submit" className="w-full glow-btn text-black font-extrabold py-3 rounded-lg text-xs tracking-wider uppercase mt-2">
                {authMode === 'login' && 'ACCESS TERMINAL'}
                {authMode === 'signup' && 'INITIALIZE ACCOUNT'}
                {authMode === 'forgot' && 'SEND RESET LINK'}
              </button>
            </form>

            <div className="flex justify-between items-center pt-2 text-xs text-gray-400">
              <button onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); setAuthMsg(''); }} className="hover:text-emerald-400 underline">
                {authMode === 'login' ? "New Trader? Register" : "Back to Login"}
              </button>

              {authMode === 'login' && (
                <button onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthMsg(''); }} className="hover:text-emerald-400 underline">
                  Forgot Password?
                </button>
              )}
            </div>
          </div>
        );
      }

      const { weeks, greenWeeks, redWeeks } = calculateWeeklyBreakdown();

      return (
        <div className="max-w-[1400px] mx-auto space-y-6">
          {/* Header */}
          <div className="glass-card p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-emerald-500/10 rounded-lg border border-emerald-500/30">
                <span className="text-2xl">⚡</span>
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-wider text-white">ADVANCED<span className="neon-green">HUB</span></h1>
                <p className="text-[10px] text-gray-400 tracking-widest uppercase flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  CONNECTED // {session.user.email}
                </p>
              </div>
            </div>

            {/* Account Selector */}
            <div className="flex items-center gap-2 bg-black/60 p-1.5 rounded-lg border border-gray-800">
              <span className="text-[10px] text-gray-400 font-bold px-2 uppercase">Account:</span>
              {['ALL', 'Live', 'Funded', 'Demo'].map(acc => (
                <button
                  key={acc}
                  onClick={() => setSelectedAccountFilter(acc)}
                  className={`px-3 py-1 rounded text-xs font-extrabold uppercase transition-all ${selectedAccountFilter === acc ? 'bg-emerald-500 text-black' : 'text-gray-400 hover:text-white'}`}
                >
                  {acc}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-3">
              <div className="flex gap-1.5 bg-black/40 p-1 rounded-lg border border-gray-800">
                {['dashboard', 'calendar', 'expenses', 'journal'].map(tab => (
                  <button 
                    key={tab} 
                    onClick={() => setActiveTab(tab)}
                    className={`px-3.5 py-2 rounded-md transition-all text-xs font-bold uppercase tracking-wide ${activeTab === tab ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
                  >
                    {tab}
                  </button>
                ))}
              </div>

              <button onClick={handleLogout} className="text-xs text-red-400 hover:text-red-300 border border-red-500/30 px-3 py-2 rounded-lg hover:bg-red-500/10 transition-all font-semibold">
                EXIT
              </button>
            </div>
          </div>

          {/* DASHBOARD TAB */}
          {activeTab === 'dashboard' && (
            <div className="space-y-6">
              
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-l-emerald-400">
                  <p className="text-[10px] text-gray-400 uppercase tracking-widest font-semibold">Net P&L ({selectedAccountFilter})</p>
                  <p className={`text-xl font-extrabold mono mt-1 ${totalPnl >= 0 ? 'neon-green' : 'neon-red'}`}>
                    ${totalPnl.toFixed(2)}
                  </p>
                </div>
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-l-emerald-500">
                  <p className="text-[10px] text-gray-400 uppercase tracking-widest font-semibold">Win Rate</p>
                  <p className="text-xl font-extrabold text-white mono mt-1">{winRate}%</p>
                </div>
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-l-blue-500">
                  <p className="text-[10px] text-gray-400 uppercase tracking-widest font-semibold">Profit Factor</p>
                  <p className="text-xl font-extrabold text-blue-400 mono mt-1">{profitFactor}</p>
                </div>
                <div className="glass-card p-3.5 rounded-xl border-l-4 border-l-yellow-500">
                  <p className="text-[10px] text-gray-400 uppercase tracking-widest font-semibold">Total Trades</p>
                  <p className="text-xl font-extrabold text-yellow-400 mono mt-1">{filteredTrades.length}</p>
                </div>
              </div>

              <div className="glass-card p-3 rounded-xl flex justify-between items-center">
                <span className="text-xs font-bold text-gray-300 uppercase tracking-wider">📁 Data Portability</span>
                <div className="flex gap-3">
                  <label className="cursor-pointer bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-bold px-3 py-1.5 rounded border border-gray-700 transition-all">
                    📥 Import CSV
                    <input type="file" accept=".csv" onChange={importCSV} className="hidden" />
                  </label>
                  <button onClick={exportCSV} className="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/40 text-xs font-bold px-3 py-1.5 rounded transition-all">
                    📤 Export CSV
                  </button>
                </div>
              </div>

              {/* Log Form */}
              <form onSubmit={handleSubmit} className="glass-card p-5 rounded-xl space-y-4">
                <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                  <h3 className="text-xs font-extrabold tracking-widest text-emerald-400 uppercase">⚡ Manual Execution Entry</h3>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Date</label>
                    <input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="input-field w-full" required />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Account</label>
                    <select value={formData.accountType} onChange={e => setFormData({...formData, accountType: e.target.value})} className="input-field w-full font-bold">
                      <option value="Live">Live Account</option>
                      <option value="Funded">Funded Account</option>
                      <option value="Demo">Demo Account</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Symbol</label>
                    <input type="text" value={formData.symbol} onChange={e => setFormData({...formData, symbol: e.target.value})} className="input-field w-full uppercase" required />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Entry Price</label>
                    <input type="number" step="any" value={formData.entry} onChange={e => setFormData({...formData, entry: e.target.value})} className="input-field w-full" />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Exit Price</label>
                    <input type="number" step="any" value={formData.exit} onChange={e => setFormData({...formData, exit: e.target.value})} className="input-field w-full" />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Position Size</label>
                    <input type="number" step="any" value={formData.size} onChange={e => setFormData({...formData, size: e.target.value})} className="input-field w-full" />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Direction</label>
                    <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="input-field w-full font-bold">
                      <option value="BUY">BUY / LONG</option>
                      <option value="SELL">SELL / SHORT</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Net Return ($)</label>
                    <input type="number" step="any" value={formData.pnl} onChange={e => setFormData({...formData, pnl: e.target.value})} className="input-field w-full font-bold" />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Setup Tag</label>
                    <select value={formData.setup} onChange={e => setFormData({...formData, setup: e.target.value})} className="input-field w-full">
                      <option value="Onion play">Onion play</option>
                      <option value="Celery">Celery</option>
                      <option value="Inverted celery">Inverted celery</option>
                      <option value="Breakout">Breakout</option>
                      <option value="Fade">Fade</option>
                      <option value="Packrunner">Packrunner</option>
                    </select>
                  </div>
                  
                  {/* Photo Upload & Paste Section */}
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">
                      Attach Image (Paste Ctrl+V or File)
                    </label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={formData.chartUrl ? (formData.chartUrl.startsWith('data:') ? '[PHOTO ATTACHED]' : formData.chartUrl) : ''} 
                        onChange={e => setFormData({...formData, chartUrl: e.target.value})} 
                        onPaste={handleImagePaste}
                        className="input-field w-full" 
                        placeholder="Paste image (Ctrl+V) or URL" 
                      />
                      <label className="cursor-pointer bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded text-xs border border-gray-700 flex items-center justify-center font-bold">
                        📷
                        <input type="file" accept="image/*" onChange={handleImageFileUpload} className="hidden" />
                      </label>
                    </div>
                  </div>

                  <div className="flex items-end">
                    <button type="submit" className="glow-btn text-black font-extrabold w-full py-2 rounded-lg text-xs tracking-wider uppercase">
                      + RECORD TRADE
                    </button>
                  </div>
                </div>
              </form>

              {/* Trade Table */}
              <div className="glass-card rounded-xl p-5 overflow-x-auto">
                <table className="w-full text-left text-xs text-gray-300 border-collapse">
                  <thead className="border-b border-gray-800 text-gray-400 font-semibold uppercase text-[10px] tracking-wider">
                    <tr>
                      <th className="p-3">Result</th>
                      <th className="p-3">Date</th>
                      <th className="p-3">Account</th>
                      <th className="p-3">Symbol</th>
                      <th className="p-3">Type</th>
                      <th className="p-3">Setup</th>
                      <th className="p-3">Chart Photo</th>
                      <th className="p-3 text-right">Return P&L</th>
                      <th className="p-3 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredTrades.length === 0 ? (
                      <tr><td colSpan="9" className="p-8 text-center text-gray-500">No trades recorded for this account filter.</td></tr>
                    ) : (
                      filteredTrades.map(t => {
                        const isWin = Number(t.pnl) >= 0;
                        return (
                          <tr key={t.id} className="border-b border-gray-800/40 hover:bg-white/[0.02]">
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-black ${isWin ? 'bg-emerald-500/15 text-emerald-400' : 'bg-red-500/15 text-red-400'}`}>
                                {isWin ? 'WIN' : 'LOSS'}
                              </span>
                            </td>
                            <td className="p-3 mono text-gray-400">{t.date}</td>
                            <td className="p-3 font-semibold text-gray-300">{t.account_type || 'Live'}</td>
                            <td className="p-3 font-bold text-white mono">{t.symbol}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded bg-gray-800 text-gray-300 text-[10px]">{t.type}</span></td>
                            <td className="p-3 text-gray-400">{t.setup}</td>
                            <td className="p-3">
                              {t.chart_url ? (
                                <a href={t.chart_url} target="_blank" rel="noreferrer" className="text-emerald-400 underline font-semibold text-[10px]">
                                  View Screenshot 🖼️
                                </a>
                              ) : (
                                <span className="text-gray-600 text-[10px]">-</span>
                              )}
                            </td>
                            <td className={`p-3 text-right font-bold mono ${isWin ? 'neon-green' : 'neon-red'}`}>
                              ${t.pnl || '0.00'}
                            </td>
                            <td className="p-3 text-center">
                              <button onClick={() => handleDeleteTrade(t.id)} className="text-xs text-red-400">🗑️</button>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* CALENDAR TAB */}
          {activeTab === 'calendar' && (
            <div className="space-y-6">
              <div className="glass-card p-5 rounded-xl flex justify-between items-center">
                <div className="flex items-center gap-4">
                  <button onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1))} className="text-gray-400 hover:text-white font-bold">&lt; PREV</button>
                  <h2 className="text-lg font-black tracking-wider text-white uppercase">
                    {calendarDate.toLocaleString('default', { month: 'long', year: 'numeric' })}
                  </h2>
                  <button onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1))} className="text-gray-400 hover:text-white font-bold">NEXT &gt;</button>
                </div>
                <div className="text-xs text-gray-400 uppercase font-mono">
                  Account Filter: <span className="text-emerald-400 font-bold">{selectedAccountFilter}</span>
                </div>
              </div>

              {/* Weekly Performance Breakdown Section (Positive vs Negative Weeks) */}
              <div className="grid grid-cols-2 sm:grid-cols-7 gap-3">
                <div className="glass-card p-3 rounded-lg border-l-4 border-l-emerald-400 col-span-1">
                  <p className="text-[10px] text-gray-400 uppercase font-semibold">Positive Weeks</p>
                  <p className="text-xl font-extrabold neon-green mono mt-1">{greenWeeks} W</p>
                </div>
                <div className="glass-card p-3 rounded-lg border-l-4 border-l-red-500 col-span-1">
                  <p className="text-[10px] text-gray-400 uppercase font-semibold">Negative Weeks</p>
                  <p className="text-xl font-extrabold neon-red mono mt-1">{redWeeks} W</p>
                </div>

                {weeks.map((wPnL, idx) => (
                  <div key={idx} className={`glass-card p-3 rounded-lg border-l-2 ${wPnL >= 0 ? 'border-l-emerald-500' : 'border-l-red-500'}`}>
                    <p className="text-[10px] text-gray-400 uppercase">Week {idx + 1}</p>
                    <p className={`text-sm font-bold mono mt-1 ${wPnL >= 0 ? 'neon-green' : 'neon-red'}`}>
                      ${wPnL.toFixed(2)}
                    </p>
                  </div>
                ))}
              </div>

              {/* Calendar Grid */}
              <div className="glass-card p-5 rounded-xl">
                <div className="grid grid-cols-7 gap-2 mb-3 text-center text-xs font-bold text-gray-400 uppercase">
                  <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {renderCalendarDays()}
                </div>
              </div>
            </div>
          )}

          {/* FUNDED EXPENSES TAB */}
          {activeTab === 'expenses' && (
            <div className="space-y-6">
              <form onSubmit={handleAddExpense} className="glass-card p-5 rounded-xl space-y-4">
                <h3 className="text-xs font-extrabold tracking-widest text-emerald-400 uppercase">💳 Track Prop Firm / Account Expenses</h3>
                <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Date Purchased</label>
                    <input type="date" value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="input-field w-full" required />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Firm Name</label>
                    <input type="text" value={expenseForm.firmName} onChange={e => setExpenseForm({...expenseForm, firmName: e.target.value})} className="input-field w-full" required />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Account Size</label>
                    <input type="text" value={expenseForm.accountSize} onChange={e => setExpenseForm({...expenseForm, accountSize: e.target.value})} className="input-field w-full" placeholder="e.g. 50K / 100K" />
                  </div>
                  <div>
                    <label className="text-[10px] text-gray-400 uppercase block mb-1">Cost ($)</label>
                    <input type="number" step="any" value={expenseForm.cost} onChange={e => setExpenseForm({...expenseForm, cost: e.target.value})} className="input-field w-full" required />
                  </div>
                  <div className="flex items-end">
                    <button type="submit" className="glow-btn text-black font-extrabold w-full py-2 rounded-lg text-xs uppercase">+ LOG EXPENSE</button>
                  </div>
                </div>
              </form>

              <div className="glass-card rounded-xl p-5">
                <table className="w-full text-left text-xs text-gray-300">
                  <thead className="border-b border-gray-800 text-gray-400 uppercase text-[10px]">
                    <tr>
                      <th className="p-3">Date</th>
                      <th className="p-3">Firm Name</th>
                      <th className="p-3">Account Size</th>
                      <th className="p-3 text-right">Cost</th>
                      <th className="p-3 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {expenses.length === 0 ? (
                      <tr><td colSpan="5" className="p-6 text-center text-gray-500">No prop firm expenses logged yet.</td></tr>
                    ) : (
                      expenses.map(exp => (
                        <tr key={exp.id} className="border-b border-gray-800/40">
                          <td className="p-3 mono text-gray-400">{exp.date}</td>
                          <td className="p-3 font-bold text-white">{exp.firm_name}</td>
                          <td className="p-3 text-gray-300">{exp.account_size}</td>
                          <td className="p-3 text-right font-bold mono neon-red">${Number(exp.cost).toFixed(2)}</td>
                          <td className="p-3 text-center">
                            <button onClick={() => handleDeleteExpense(exp.id)} className="text-xs text-red-400">🗑️</button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* DAILY JOURNAL TAB */}
          {activeTab === 'journal' && (
            <div className="space-y-6">
              <div className="glass-card p-4 rounded-xl flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <label className="text-xs font-bold text-gray-400 uppercase">Select Journal Date:</label>
                  <input 
                    type="date" 
                    value={journalDate} 
                    onChange={e => setJournalDate(e.target.value)} 
                    className="input-field font-mono"
                  />
                </div>
                <button onClick={saveJournalEntry} className="glow-btn text-black font-extrabold px-4 py-2 rounded text-xs uppercase">
                  💾 Save Entry
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="glass-card p-6 rounded-xl space-y-3">
                  <h3 className="text-sm font-extrabold text-emerald-400 border-b border-gray-800 pb-2 flex items-center gap-2">
                    <span>📈</span> Market Session & Setup Notes
                  </h3>
                  <textarea 
                    value={marketNotes} 
                    onChange={e => setMarketNotes(e.target.value)} 
                    placeholder={`Record macro levels, news releases, session liquidity for ${journalDate}...`} 
                    className="w-full h-80 bg-black/60 border border-gray-800 p-4 text-xs text-gray-200 rounded-lg focus:border-emerald-500 focus:outline-none resize-none font-mono"
                  ></textarea>
                </div>

                <div className="glass-card p-6 rounded-xl space-y-3">
                  <h3 className="text-sm font-extrabold text-purple-400 border-b border-gray-800 pb-2 flex items-center gap-2">
                    <span>🧠</span> Mindset & Emotional State
                  </h3>
                  <textarea 
                    value={personalNotes} 
                    onChange={e => setPersonalNotes(e.target.value)} 
                    placeholder={`Record fatigue, FOMO triggers, and mindset reflections for ${journalDate}...`} 
                    className="w-full h-80 bg-black/60 border border-gray-800 p-4 text-xs text-gray-200 rounded-lg focus:border-purple-500 focus:outline-none resize-none font-mono"
                  ></textarea>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
