<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADEHUB // Performance Terminal</title>
  
  <!-- App Logo / Favicon -->
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">

  <!-- PWA Manifest & Service Worker -->
  <link rel="manifest" href="./manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0b0f19',
            cardDark: '#131b2e',
            cardBorder: '#1e293b',
            accentGreen: '#00E599',
            accentRed: '#FF4D4D',
            accentYellow: '#F59E0B',
            accentCyan: '#06B6D4'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .input-field {
      background-color: rgba(15, 23, 42, 0.7);
      border: 1px solid #1e293b;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      width: 100%;
      transition: all 0.15s ease;
    }
    .input-field:focus { border-color: #00E599; outline: none; box-shadow: 0 0 0 2px rgba(0,229,153,0.15); }
    .glow-btn {
      background: linear-gradient(135deg, #00E599, #00b876);
      box-shadow: 0 0 12px rgba(0, 229, 153, 0.25);
      transition: all 0.15s ease;
    }
    .glow-btn:hover { box-shadow: 0 0 20px rgba(0, 229, 153, 0.5); transform: translateY(-1px); }
    .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 1rem; }
  </style>
</head>
<body class="bg-bgDark text-gray-200 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SUPABASE_URL = "https://uydgnqqmkmoemmyrorbg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_IaI9Dt8lIL2m2-cIrq9Gug_NdeWchok";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const EMOTIONS = ['Focus', 'Discipline', 'Fear', 'Greed', 'FOMO', 'Anger', 'Boredom'];
    const SETUPS = ['Onion play', 'Celery', 'Inverted celery', 'Breakout', 'Fade', 'Packrunner'];
    const NAV_ITEMS = [
      { id: 'dashboard', label: 'Dashboard', icon: '📊' },
      { id: 'trades', label: 'Trades', icon: '📈' },
      { id: 'calendar', label: 'Calendar', icon: '🗓️' },
      { id: 'expenses', label: 'Expenses', icon: '💳' },
      { id: 'journal', label: 'Journal', icon: '📓' }
    ];

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width, height = img.height;
          if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
          else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    function App() {
      const [session, setSession] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [authMode, setAuthMode] = useState('login'); // 'login', 'signup', 'forgot', 'reset'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authMsg, setAuthMsg] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [selectedAccountFilter, setSelectedAccountFilter] = useState('ALL');
      const [trades, setTrades] = useState([]);
      const [expenses, setExpenses] = useState([]);

      const [calendarDate, setCalendarDate] = useState(new Date());
      const [journalDate, setJournalDate] = useState(new Date().toISOString().split('T')[0]);
      const [marketNotes, setMarketNotes] = useState('');
      const [personalNotes, setPersonalNotes] = useState('');

      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        symbol: 'NQ', accountType: 'Funded', entry: '', exit: '', size: '', type: 'BUY',
        pnl: '', setup: 'Onion play', emotion: 'Focus', chartUrl: ''
      });

      const [expenseForm, setExpenseForm] = useState({
        date: new Date().toISOString().split('T')[0],
        firmName: 'Apex Trader Funding', accountSize: '50K', cost: '', status: 'Active'
      });

      const miniDonutRef = useRef(null);
      const radarRef = useRef(null);
      const dailyPnlRef = useRef(null);
      const equityRef = useRef(null);
      const setupPerfRef = useRef(null);
      const symbolPerfRef = useRef(null);
      const chartInstances = useRef({});

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) { fetchUserTrades(session.user.id); fetchExpenses(session.user.id); }
          setLoadingAuth(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          setSession(session);
          if (event === 'PASSWORD_RECOVERY') {
            setAuthMode('reset');
            setAuthMsg('Enter your new password below.');
          }
          if (session) { fetchUserTrades(session.user.id); fetchExpenses(session.user.id); }
          setLoadingAuth(false);
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => { if (session) fetchJournalEntry(journalDate); }, [journalDate, session]);

      const fetchUserTrades = async (userId) => {
        const { data, error } = await supabase.from('trades').select('*').eq('user_id', userId).order('id', { ascending: true });
        if (!error && data) setTrades(data);
      };

      const fetchExpenses = async (userId) => {
        const { data, error } = await supabase.from('account_expenses').select('*').eq('user_id', userId).order('date', { ascending: false });
        if (!error && data) setExpenses(data);
      };

      const fetchJournalEntry = async (dateStr) => {
        const { data } = await supabase.from('journal_entries').select('*').eq('user_id', session.user.id).eq('date', dateStr).maybeSingle();
        if (data) { setMarketNotes(data.market_notes || ''); setPersonalNotes(data.personal_notes || ''); }
        else { setMarketNotes(''); setPersonalNotes(''); }
      };

      const saveJournalEntry = async () => {
        const { error } = await supabase.from('journal_entries').upsert({
          user_id: session.user.id, date: journalDate, market_notes: marketNotes, personal_notes: personalNotes
        }, { onConflict: 'user_id,date' });
        if (!error) alert("Journal entry saved!"); else alert("Error saving journal: " + error.message);
      };

      const handleDeleteTrade = async (tradeId) => {
        if (window.confirm("Delete this execution?")) {
          const { error } = await supabase.from('trades').delete().eq('id', tradeId);
          if (!error) fetchUserTrades(session.user.id); else alert("Error deleting trade: " + error.message);
        }
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const newExpense = {
          user_id: session.user.id, date: expenseForm.date, firm_name: expenseForm.firmName,
          account_size: expenseForm.accountSize, cost: parseFloat(expenseForm.cost || 0), status: expenseForm.status
        };
        const { error } = await supabase.from('account_expenses').insert([newExpense]);
        if (!error) {
          setExpenseForm({ date: new Date().toISOString().split('T')[0], firmName: 'Apex Trader Funding', accountSize: '50K', cost: '', status: 'Active' });
          fetchExpenses(session.user.id);
        } else alert("Error saving expense: " + error.message);
      };

      const handleDeleteExpense = async (id) => {
        const { error } = await supabase.from('account_expenses').delete().eq('id', id);
        if (!error) fetchExpenses(session.user.id);
      };

      const filteredTrades = useMemo(() => {
        if (selectedAccountFilter === 'ALL') return trades;
        return trades.filter(t => (t.account_type || 'Live') === selectedAccountFilter);
      }, [trades, selectedAccountFilter]);

      const handleAuth = async (e) => {
        e.preventDefault(); setAuthError(''); setAuthMsg('');
        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthError(error.message);
        } else if (authMode === 'signup') {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setAuthError(error.message); else setAuthMsg("Account created! You can now log in.");
        } else if (authMode === 'forgot') {
          const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
          if (error) setAuthError(error.message); else setAuthMsg("Password reset email sent! Check your inbox.");
        } else if (authMode === 'reset') {
          const { error } = await supabase.auth.updateUser({ password: newPassword });
          if (error) setAuthError(error.message);
          else {
            setAuthMsg("Password updated successfully! You are now logged in.");
            setAuthMode('login');
            setNewPassword('');
          }
        }
      };

      const handleLogout = async () => { await supabase.auth.signOut(); setSession(null); setTrades([]); };

      const handleImagePaste = (e) => {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            compressImage(items[i].getAsFile(), (b64) => setFormData(prev => ({ ...prev, chartUrl: b64 })));
          }
        }
      };

      const handleImageFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) compressImage(file, (b64) => setFormData(prev => ({ ...prev, chartUrl: b64 })));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!session) return alert("Session expired. Please log in again.");
        let calculatedPnl = formData.pnl;
        if (!calculatedPnl && formData.entry && formData.exit && formData.size) {
          const entry = parseFloat(formData.entry), exit = parseFloat(formData.exit), size = parseFloat(formData.size);
          calculatedPnl = (formData.type === 'BUY') ? ((exit - entry) * size).toFixed(2) : ((entry - exit) * size).toFixed(2);
        }
        const newTrade = {
          date: formData.date, symbol: formData.symbol,
          entry: formData.entry ? parseFloat(formData.entry) : null,
          exit: formData.exit ? parseFloat(formData.exit) : null,
          size: formData.size ? parseFloat(formData.size) : null,
          type: formData.type, pnl: parseFloat(calculatedPnl || 0),
          setup: formData.setup, emotion: formData.emotion,
          account_type: formData.accountType, chart_url: formData.chartUrl || null,
          user_id: session.user.id
        };
        const { error } = await supabase.from('trades').insert([newTrade]);
        if (!error) {
          setFormData({
            date: new Date().toISOString().split('T')[0], symbol: 'NQ', accountType: 'Funded',
            entry: '', exit: '', size: '', type: 'BUY', pnl: '', setup: 'Onion play', emotion: 'Focus', chartUrl: ''
          });
          fetchUserTrades(session.user.id);
        } else alert("Database Error: " + error.message);
      };

      const exportCSV = () => {
        if (filteredTrades.length === 0) return alert("No trades to export.");
        const headers = ["Date", "Account", "Symbol", "Type", "Entry", "Exit", "Size", "Setup", "Emotion", "P&L"];
        const rows = filteredTrades.map(t => [t.date, t.account_type || 'Live', t.symbol, t.type, t.entry, t.exit, t.size, t.setup, t.emotion, t.pnl]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `trading_journal_${selectedAccountFilter}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const importCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          const lines = event.target.result.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length < 2) return alert("Invalid CSV format.");
          const newTrades = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",");
            if (cols.length >= 8) {
              newTrades.push({
                date: cols[0], account_type: cols[1] || 'Live', symbol: cols[2], type: cols[3],
                entry: parseFloat(cols[4]) || 0, exit: parseFloat(cols[5]) || 0, size: parseFloat(cols[6]) || 0,
                setup: cols[7] || 'Onion play', emotion: cols[8] || 'Focus', pnl: parseFloat(cols[9]) || 0,
                user_id: session.user.id
              });
            }
          }
          if (newTrades.length > 0) {
            const { error } = await supabase.from('trades').insert(newTrades);
            if (!error) { alert(`Successfully imported ${newTrades.length} trades!`); fetchUserTrades(session.user.id); }
            else alert("Import failed: " + error.message);
          }
        };
        reader.readAsText(file);
      };

      const totalPnl = filteredTrades.reduce((acc, t) => acc + Number(t.pnl || 0), 0);
      const winsList = filteredTrades.filter(t => Number(t.pnl) > 0);
      const lossesList = filteredTrades.filter(t => Number(t.pnl) < 0);
      const totalWinDollar = winsList.reduce((acc, t) => acc + Number(t.pnl), 0);
      const totalLossDollar = Math.abs(lossesList.reduce((acc, t) => acc + Number(t.pnl), 0));
      const profitFactor = totalLossDollar > 0 ? (totalWinDollar / totalLossDollar).toFixed(2) : (totalWinDollar > 0 ? '∞' : '0.00');
      const winRate = filteredTrades.length > 0 ? Math.round((winsList.length / filteredTrades.length) * 100) : 0;
      const avgTrade = filteredTrades.length > 0 ? (totalPnl / filteredTrades.length) : 0;
      const avgWin = winsList.length > 0 ? (totalWinDollar / winsList.length) : 0;
      const avgLoss = lossesList.length > 0 ? (totalLossDollar / lossesList.length) : 0;
      const avgWinLossRatio = avgLoss > 0 ? (avgWin / avgLoss).toFixed(2) : (avgWin > 0 ? '∞' : '0.00');

      const dayMap = {};
      filteredTrades.forEach(t => {
        if (!t.date) return;
        if (!dayMap[t.date]) dayMap[t.date] = 0;
        dayMap[t.date] += Number(t.pnl || 0);
      });
      const dayEntries = Object.entries(dayMap).sort((a, b) => a[0].localeCompare(b[0]));
      const greenDays = dayEntries.filter(([, v]) => v > 0).length;
      const dayWinRate = dayEntries.length > 0 ? Math.round((greenDays / dayEntries.length) * 100) : 0;

      const emotionMap = {};
      filteredTrades.forEach(t => {
        const emo = t.emotion || 'Unspecified';
        if (!emotionMap[emo]) emotionMap[emo] = { count: 0, wins: 0, pnl: 0 };
        emotionMap[emo].count += 1;
        emotionMap[emo].pnl += Number(t.pnl || 0);
        if (Number(t.pnl) > 0) emotionMap[emo].wins += 1;
      });
      const emotionStats = Object.entries(emotionMap).map(([emo, d]) => ({
        emotion: emo, count: d.count, winRate: d.count > 0 ? Math.round((d.wins / d.count) * 100) : 0, avgPnl: d.count > 0 ? d.pnl / d.count : 0
      })).sort((a, b) => b.count - a.count);
      const dominantEmotion = emotionStats.length > 0 ? emotionStats[0] : null;

      const setupMap = {};
      filteredTrades.forEach(t => { const s = t.setup || 'Unspecified'; setupMap[s] = (setupMap[s] || 0) + Number(t.pnl || 0); });
      const setupEntries = Object.entries(setupMap).sort((a, b) => b[1] - a[1]);
      const bestSetup = setupEntries.length > 0 ? setupEntries[0] : null;

      const symbolMap = {};
      filteredTrades.forEach(t => { const s = t.symbol || 'N/A'; symbolMap[s] = (symbolMap[s] || 0) + Number(t.pnl || 0); });
      const symbolEntries = Object.entries(symbolMap).sort((a, b) => b[1] - a[1]);
      const bestSymbol = symbolEntries.length > 0 ? symbolEntries[0] : null;

      let longestStreak = 0, currentStreak = 0;
      filteredTrades.forEach(t => {
        if (Number(t.pnl) > 0) { currentStreak += 1; longestStreak = Math.max(longestStreak, currentStreak); }
        else currentStreak = 0;
      });

      const renderCalendarDays = () => {
        const year = calendarDate.getFullYear(), month = calendarDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const tradesByDate = {};
        filteredTrades.forEach(t => {
          if (!t.date) return;
          if (!tradesByDate[t.date]) tradesByDate[t.date] = { count: 0, pnl: 0 };
          tradesByDate[t.date].count += 1;
          tradesByDate[t.date].pnl += Number(t.pnl || 0);
        });
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push(<div key={`empty-${i}`} className="h-24 bg-black/20 rounded-lg border border-cardBorder/50"></div>);
        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dayData = tradesByDate[dateStr];
          cells.push(
            <div key={day} className={`h-24 p-2 rounded-lg border flex flex-col justify-between transition-all ${dayData ? (dayData.pnl >= 0 ? 'bg-accentGreen/10 border-accentGreen/30' : 'bg-accentRed/10 border-accentRed/30') : 'bg-black/20 border-cardBorder/50'}`}>
              <div className="flex justify-between items-center text-xs font-bold">
                <span className="text-gray-400">{day}</span>
                {dayData && <span className="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 font-mono text-gray-300">{dayData.count} {dayData.count === 1 ? 'trade' : 'trades'}</span>}
              </div>
              {dayData ? (
                <div className={`text-sm font-black mono text-right ${dayData.pnl >= 0 ? 'text-accentGreen' : 'text-accentRed'}`}>${dayData.pnl.toFixed(2)}</div>
              ) : (<div className="text-[10px] text-gray-600 text-right font-mono">-</div>)}
            </div>
          );
        }
        return cells;
      };

      const calculateWeeklyBreakdown = () => {
        const year = calendarDate.getFullYear(), month = calendarDate.getMonth();
        const weeks = [0, 0, 0, 0, 0];
        filteredTrades.forEach(t => {
          if (!t.date) return;
          const [dYear, dMonth, dDay] = t.date.split('-').map(Number);
          if (dYear === year && dMonth === month + 1) {
            const weekIdx = Math.min(Math.floor((dDay - 1) / 7), 4);
            weeks[weekIdx] += Number(t.pnl || 0);
          }
        });
        return { weeks, greenWeeks: weeks.filter(w => w > 0).length, redWeeks: weeks.filter(w => w < 0).length };
      };

      useEffect(() => {
        if (activeTab !== 'dashboard' || !session) return;
        const destroy = (key) => { if (chartInstances.current[key]) { chartInstances.current[key].destroy(); delete chartInstances.current[key]; } };
        const gridColor = '#1e293b', tickColor = '#64748b';

        if (miniDonutRef.current) {
          destroy('donut');
          chartInstances.current.donut = new Chart(miniDonutRef.current, {
            type: 'doughnut',
            data: { datasets: [{ data: [winsList.length, lossesList.length], backgroundColor: ['#00E599', '#FF4D4D'], borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }
          });
        }

        if (radarRef.current) {
          destroy('radar');
          const radarProfitFactor = profitFactor === '∞' ? 100 : Math.min(100, Number(profitFactor) * 20);
          const radarAvgRR = avgWinLossRatio === '∞' ? 100 : Math.min(100, Number(avgWinLossRatio) * 40);
          const radarVolume = Math.min(100, (filteredTrades.length / 50) * 100);
          chartInstances.current.radar = new Chart(radarRef.current, {
            type: 'radar',
            data: {
              labels: ['Win Rate', 'Profit Factor', 'Day Consistency', 'Avg R:R', 'Volume'],
              datasets: [{ data: [winRate, radarProfitFactor, dayWinRate, radarAvgRR, radarVolume], backgroundColor: 'rgba(0,229,153,0.2)', borderColor: '#00E599', pointBackgroundColor: '#00E599' }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              scales: { r: { angleLines: { color: gridColor }, grid: { color: gridColor }, pointLabels: { color: tickColor, font: { size: 10 } }, ticks: { display: false } } },
              plugins: { legend: { display: false } }
            }
          });
        }

        if (dailyPnlRef.current) {
          destroy('daily');
          chartInstances.current.daily = new Chart(dailyPnlRef.current, {
            type: 'bar',
            data: { labels: dayEntries.map(([d]) => d.slice(5)), datasets: [{ data: dayEntries.map(([, v]) => v), backgroundColor: (ctx) => ctx.raw >= 0 ? '#00E599' : '#FF4D4D', borderRadius: 4 }] },
            options: {
              responsive: true, maintainAspectRatio: false,
              scales: { x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 9 } } }, y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } } },
              plugins: { legend: { display: false } }
            }
          });
        }

        if (equityRef.current) {
          destroy('equity');
          let running = 0;
          const equityData = filteredTrades.map(t => { running += Number(t.pnl || 0); return running; });
          chartInstances.current.equity = new Chart(equityRef.current, {
            type: 'line',
            data: { labels: filteredTrades.map((_, i) => `#${i + 1}`), datasets: [{ data: equityData, borderColor: '#00E599', backgroundColor: 'rgba(0,229,153,0.08)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }] },
            options: {
              responsive: true, maintainAspectRatio: false,
              scales: { x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } }, y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } } },
              plugins: { legend: { display: false } }
            }
          });
        }

        if (setupPerfRef.current) {
          destroy('setup');
          chartInstances.current.setup = new Chart(setupPerfRef.current, {
            type: 'bar',

                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Symbol</label><input type="text" value={formData.symbol} onChange={e => setFormData({ ...formData, symbol: e.target.value })} className="input-field uppercase" required /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Entry Price</label><input type="number" step="any" value={formData.entry} onChange={e => setFormData({ ...formData, entry: e.target.value })} className="input-field" /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Exit Price</label><input type="number" step="any" value={formData.exit} onChange={e => setFormData({ ...formData, exit: e.target.value })} className="input-field" /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Size</label><input type="number" step="any" value={formData.size} onChange={e => setFormData({ ...formData, size: e.target.value })} className="input-field" /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Direction</label>
                        <select value={formData.type} onChange={e => setFormData({ ...formData, type: e.target.value })} className="input-field font-bold">
                          <option value="BUY">BUY / LONG</option><option value="SELL">SELL / SHORT</option>
                        </select>
                      </div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Emotion</label>
                        <select value={formData.emotion} onChange={e => setFormData({ ...formData, emotion: e.target.value })} className="input-field font-bold">
                          {EMOTIONS.map(em => <option key={em} value={em}>{em}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Net Return ($)</label><input type="number" step="any" value={formData.pnl} onChange={e => setFormData({ ...formData, pnl: e.target.value })} className="input-field font-bold" placeholder="auto-calculated if blank" /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Setup Tag</label>
                        <select value={formData.setup} onChange={e => setFormData({ ...formData, setup: e.target.value })} className="input-field">
                          {SETUPS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] text-gray-400 uppercase block mb-1">Screenshot (Ctrl+V or File)</label>
                        <div className="flex gap-2">
                          <input type="text" value={formData.chartUrl ? (formData.chartUrl.startsWith('data:') ? '✅ [PHOTO ATTACHED]' : formData.chartUrl) : ''} onChange={e => setFormData({ ...formData, chartUrl: e.target.value })} onPaste={handleImagePaste} className="input-field" placeholder="Click here & Ctrl+V screenshot" />
                          <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-gray-300 px-3 py-2 rounded text-xs border border-cardBorder flex items-center justify-center font-bold">
                            📷<input type="file" accept="image/*" onChange={handleImageFileUpload} className="hidden" />
                          </label>
                        </div>
                      </div>
                      <div className="flex items-end"><button type="submit" className="glow-btn text-black font-extrabold w-full py-2 rounded-lg text-xs tracking-wider uppercase">+ RECORD TRADE</button></div>
                    </div>
                  </form>

                  <div className="card p-5 overflow-x-auto">
                    <table className="w-full text-left text-xs text-gray-300 border-collapse">
                      <thead className="border-b border-cardBorder text-gray-400 font-semibold uppercase text-[10px] tracking-wider">
                        <tr>
                          <th className="p-3">Result</th><th className="p-3">Date</th><th className="p-3">Account</th><th className="p-3">Symbol</th>
                          <th className="p-3">Type</th><th className="p-3">Setup</th><th className="p-3">Emotion</th><th className="p-3">Chart</th>
                          <th className="p-3 text-right">P&L</th><th className="p-3 text-center">Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredTrades.length === 0 ? (
                          <tr><td colSpan="10" className="p-8 text-center text-gray-500">No trades recorded for this account filter.</td></tr>
                        ) : filteredTrades.map(t => {
                          const isWin = Number(t.pnl) >= 0;
                          return (
                            <tr key={t.id} className="border-b border-cardBorder/40 hover:bg-white/[0.02]">
                              <td className="p-3"><span className={`px-2 py-0.5 rounded text-[10px] font-black ${isWin ? 'bg-accentGreen/15 text-accentGreen' : 'bg-accentRed/15 text-accentRed'}`}>{isWin ? 'WIN' : 'LOSS'}</span></td>
                              <td className="p-3 mono text-gray-400">{t.date}</td>
                              <td className="p-3 font-semibold text-gray-300">{t.account_type || 'Live'}</td>
                              <td className="p-3 font-bold text-white mono">{t.symbol}</td>
                              <td className="p-3"><span className="px-2 py-0.5 rounded bg-slate-800 text-gray-300 text-[10px]">{t.type}</span></td>
                              <td className="p-3 text-gray-400">{t.setup}</td>
                              <td className="p-3 text-gray-400">{t.emotion || '-'}</td>
                              <td className="p-3">{t.chart_url ? <a href={t.chart_url} target="_blank" rel="noreferrer" className="text-accentGreen underline font-semibold text-[10px]">View 🖼️</a> : <span className="text-gray-600 text-[10px]">-</span>}</td>
                              <td className={`p-3 text-right font-bold mono ${isWin ? 'text-accentGreen' : 'text-accentRed'}`}>${t.pnl || '0.00'}</td>
                              <td className="p-3 text-center"><button onClick={() => handleDeleteTrade(t.id)} className="text-xs text-accentRed">🗑️</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'calendar' && (
                <div className="space-y-6">
                  <div className="card p-5 flex justify-between items-center">
                    <div className="flex items-center gap-4">
                      <button onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1))} className="text-gray-400 hover:text-white font-bold">&lt; PREV</button>
                      <h2 className="text-lg font-black tracking-wider text-white uppercase">{calendarDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
                      <button onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1))} className="text-gray-400 hover:text-white font-bold">NEXT &gt;</button>
                    </div>
                    <div className="text-xs text-gray-400 uppercase font-mono">Account Filter: <span className="text-accentGreen font-bold">{selectedAccountFilter}</span></div>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-7 gap-3">
                    <div className="card p-3 border-l-4 border-l-accentGreen col-span-1"><p className="text-[10px] text-gray-400 uppercase font-semibold">Positive Weeks</p><p className="text-xl font-extrabold text-accentGreen mono mt-1">{greenWeeks} W</p></div>
                    <div className="card p-3 border-l-4 border-l-accentRed col-span-1"><p className="text-[10px] text-gray-400 uppercase font-semibold">Negative Weeks</p><p className="text-xl font-extrabold text-accentRed mono mt-1">{redWeeks} W</p></div>
                    {weeks.map((wPnL, idx) => (
                      <div key={idx} className={`card p-3 border-l-2 ${wPnL >= 0 ? 'border-l-accentGreen' : 'border-l-accentRed'}`}>
                        <p className="text-[10px] text-gray-400 uppercase">Week {idx + 1}</p>
                        <p className={`text-sm font-bold mono mt-1 ${wPnL >= 0 ? 'text-accentGreen' : 'text-accentRed'}`}>${wPnL.toFixed(2)}</p>
                      </div>
                    ))}
                  </div>
                  <div className="card p-5">
                    <div className="grid grid-cols-7 gap-2 mb-3 text-center text-xs font-bold text-gray-400 uppercase">
                      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div className="grid grid-cols-7 gap-2">{renderCalendarDays()}</div>
                  </div>
                </div>
              )}

              {activeTab === 'expenses' && (
                <div className="space-y-6">
                  <form onSubmit={handleAddExpense} className="card p-5 space-y-4">
                    <h3 className="text-xs font-extrabold tracking-widest text-accentGreen uppercase">💳 Track Prop Firm / Account Expenses</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Date Purchased</label><input type="date" value={expenseForm.date} onChange={e => setExpenseForm({ ...expenseForm, date: e.target.value })} className="input-field" required /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Firm Name</label><input type="text" value={expenseForm.firmName} onChange={e => setExpenseForm({ ...expenseForm, firmName: e.target.value })} className="input-field" required /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Account Size</label><input type="text" value={expenseForm.accountSize} onChange={e => setExpenseForm({ ...expenseForm, accountSize: e.target.value })} className="input-field" placeholder="e.g. 50K / 100K" /></div>
                      <div><label className="text-[10px] text-gray-400 uppercase block mb-1">Cost ($)</label><input type="number" step="any" value={expenseForm.cost} onChange={e => setExpenseForm({ ...expenseForm, cost: e.target.value })} className="input-field" required /></div>
                      <div className="flex items-end"><button type="submit" className="glow-btn text-black font-extrabold w-full py-2 rounded-lg text-xs uppercase">+ LOG EXPENSE</button></div>
                    </div>
                  </form>
                  <div className="card p-5">
                    <table className="w-full text-left text-xs text-gray-300">
                      <thead className="border-b border-cardBorder text-gray-400 uppercase text-[10px]">
                        <tr><th className="p-3">Date</th><th className="p-3">Firm Name</th><th className="p-3">Account Size</th><th className="p-3 text-right">Cost</th><th className="p-3 text-center">Action</th></tr>
                      </thead>
                      <tbody>
                        {expenses.length === 0 ? (
                          <tr><td colSpan="5" className="p-6 text-center text-gray-500">No prop firm expenses logged yet.</td></tr>
                        ) : expenses.map(exp => (
                          <tr key={exp.id} className="border-b border-cardBorder/40">
                            <td className="p-3 mono text-gray-400">{exp.date}</td>
                            <td className="p-3 font-bold text-white">{exp.firm_name}</td>
                            <td className="p-3 text-gray-300">{exp.account_size}</td>
                            <td className="p-3 text-right font-bold mono text-accentRed">${Number(exp.cost).toFixed(2)}</td>
                            <td className="p-3 text-center"><button onClick={() => handleDeleteExpense(exp.id)} className="text-xs text-accentRed">🗑️</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'journal' && (
                <div className="space-y-6">
                  <div className="card p-4 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <label className="text-xs font-bold text-gray-400 uppercase">Select Journal Date:</label>
                      <input type="date" value={journalDate} onChange={e => setJournalDate(e.target.value)} className="input-field font-mono w-auto" />
                    </div>
                    <button onClick={saveJournalEntry} className="glow-btn text-black font-extrabold px-4 py-2 rounded text-xs uppercase">💾 Save Entry</button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="card p-6 space-y-3">
                      <h3 className="text-sm font-extrabold text-accentGreen border-b border-cardBorder pb-2 flex items-center gap-2"><span>📈</span> Market Session & Setup Notes</h3>
                      <textarea value={marketNotes} onChange={e => setMarketNotes(e.target.value)} placeholder={`Record macro levels, news releases, session liquidity for ${journalDate}...`} className="w-full h-80 bg-black/40 border border-cardBorder p-4 text-xs text-gray-200 rounded-lg focus:border-accentGreen focus:outline-none resize-none font-mono"></textarea>
                    </div>
                    <div className="card p-6 space-y-3">
                      <h3 className="text-sm font-extrabold text-purple-400 border-b border-cardBorder pb-2 flex items-center gap-2"><span>🧠</span> Mindset & Emotional State</h3>
                      <textarea value={personalNotes} onChange={e => setPersonalNotes(e.target.value)} placeholder={`Record fatigue, FOMO triggers, and mindset reflections for ${journalDate}...`} className="w-full h-80 bg-black/40 border border-cardBorder p-4 text-xs text-gray-200 rounded-lg focus:border-purple-500 focus:outline-none resize-none font-mono"></textarea>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
