<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AdvancedHub // Trading Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .neon-green { color: #00e676; }
    .bg-neon-green { background-color: #00e676; }
    .neon-red { color: #ff5252; }
    .glass-panel { background: #131822; border: 1px solid #1f293d; }
    .input-field { background-color: #0b0e14; border: 1px solid #1f293d; color: white; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
    .input-field:focus { border-color: #00e676; outline: none; }
  </style>
</head>
<body class="p-6">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://uydgnqqmkmoemmyrorbg.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_IaI9Dt8lIL2m2-cIrq9Gug_NdeWchok"; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [session, setSession] = React.useState(null);
      const [authMode, setAuthMode] = React.useState('login'); 
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [authError, setAuthError] = React.useState('');

      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [trades, setTrades] = React.useState([]);
      const [formData, setFormData] = React.useState({ 
        date: new Date().toISOString().split('T')[0],
        symbol: 'NQ', entry: '', exit: '', size: '', type: 'BUY', pnl: '', emotion: 'Focus'
      });

      const [marketNotes, setMarketNotes] = React.useState(localStorage.getItem('market_notes') || '');
      const [personalNotes, setPersonalNotes] = React.useState(localStorage.getItem('personal_notes') || '');

      React.useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) fetchUserTrades(session.user.id);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) fetchUserTrades(session.user.id);
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchUserTrades = async (userId) => {
        const { data, error } = await supabase
          .from('trades')
          .select('*')
          .eq('user_id', userId)
          .order('id', { ascending: false });

        if (!error && data) setTrades(data);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthError(error.message);
        } else {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setAuthError(error.message);
          else alert("Account created! You can now log in.");
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setTrades([]);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!session) return;

        let calculatedPnl = formData.pnl;
        if (!calculatedPnl && formData.entry && formData.exit && formData.size) {
          const entry = parseFloat(formData.entry);
          const exit = parseFloat(formData.exit);
          const size = parseFloat(formData.size);
          calculatedPnl = (formData.type === 'CALL' || formData.type === 'BUY') 
            ? ((exit - entry) * size).toFixed(2) 
            : ((entry - exit) * size).toFixed(2);
        }

        const newTrade = { 
          date: formData.date,
          symbol: formData.symbol,
          entry: formData.entry ? parseFloat(formData.entry) : null,
          exit: formData.exit ? parseFloat(formData.exit) : null,
          size: formData.size ? parseFloat(formData.size) : null,
          type: formData.type,
          pnl: parseFloat(calculatedPnl || 0),
          emotion: formData.emotion,
          user_id: session.user.id 
        };

        const { error } = await supabase.from('trades').insert([newTrade]);
        if (!error) {
          setFormData({ 
            date: new Date().toISOString().split('T')[0],
            symbol: 'NQ', entry: '', exit: '', size: '', type: 'BUY', pnl: '', emotion: 'Focus' 
          });
          fetchUserTrades(session.user.id);
        } else {
          alert("Error saving trade: " + error.message);
        }
      };

      const totalPnl = trades.reduce((acc, t) => acc + Number(t.pnl || 0), 0);
      const wins = trades.filter(t => Number(t.pnl) > 0).length;
      const losses = trades.filter(t => Number(t.pnl) < 0).length;
      const winRate = trades.length > 0 ? Math.round((wins / trades.length) * 100) : 0;

      // Authentication Screen
      if (!session) {
        return (
          <div className="max-w-md mx-auto mt-20 glass-panel p-8 rounded-lg space-y-6">
            <div className="text-center space-y-2">
              <h1 className="text-2xl font-bold tracking-wide">ADVANCEDHUB</h1>
              <p className="text-xs text-gray-500 uppercase">Private Trading Terminal Access</p>
            </div>

            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="text-xs text-gray-400 block mb-1">Email</label>
                <input 
                  type="email" 
                  value={email} 
                  onChange={e => setEmail(e.target.value)} 
                  className="input-field w-full py-2" 
                  required 
                />
              </div>
              <div>
                <label className="text-xs text-gray-400 block mb-1">Password</label>
                <input 
                  type="password" 
                  value={password} 
                  onChange={e => setPassword(e.target.value)} 
                  className="input-field w-full py-2" 
                  required 
                />
              </div>

              {authError && <p className="text-xs text-red-400 font-mono">{authError}</p>}

              <button type="submit" className="w-full bg-emerald-500 text-black font-bold py-2 rounded text-xs hover:bg-emerald-400 transition-all">
                {authMode === 'login' ? 'LOG IN' : 'CREATE ACCOUNT'}
              </button>
            </form>

            <div className="text-center">
              <button 
                onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')} 
                className="text-xs text-gray-400 hover:text-white underline"
              >
                {authMode === 'login' ? "Don't have an account? Sign Up" : "Already have an account? Log In"}
              </button>
            </div>
          </div>
        );
      }

      // Logged-in View
      return (
        <div className="max-w-7xl mx-auto space-y-6">
          <div className="flex justify-between items-center border-b border-gray-800 pb-4">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-emerald-500/10 rounded-full border border-emerald-500/30">
                <span className="text-xl">⚡</span>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-wide">ADVANCEDHUB</h1>
                <p className="text-[10px] text-gray-500 tracking-widest uppercase">Logged in as {session.user.email}</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="flex gap-2 font-semibold text-xs">
                {['dashboard', 'behavioral', 'journal'].map(tab => (
                  <button 
                    key={tab} 
                    onClick={() => setActiveTab(tab)}
                    className={`px-4 py-2 rounded transition-all uppercase ${activeTab === tab ? 'bg-emerald-500 text-black font-bold shadow-lg shadow-emerald-500/20' : 'text-gray-400 hover:text-white glass-panel'}`}
                  >
                    {tab}
                  </button>
                ))}
              </div>
              <button onClick={handleLogout} className="text-xs text-red-400 border border-red-500/30 px-3 py-2 rounded hover:bg-red-500/10">
                LOGOUT
              </button>
            </div>
          </div>

          {/* DASHBOARD TAB */}
          {activeTab === 'dashboard' && (
            <div className="space-y-6">
              <form onSubmit={handleSubmit} className="glass-panel p-4 rounded-lg flex flex-wrap gap-3 items-center">
                <input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="input-field" required />
                <input type="text" placeholder="Symbol" value={formData.symbol} onChange={e => setFormData({...formData, symbol: e.target.value})} className="input-field w-20" required />
                <input type="number" step="any" placeholder="Entry $" value={formData.entry} onChange={e => setFormData({...formData, entry: e.target.value})} className="input-field w-24" />
                <input type="number" step="any" placeholder="Exit $" value={formData.exit} onChange={e => setFormData({...formData, exit: e.target.value})} className="input-field w-24" />
                <input type="number" placeholder="Size" value={formData.size} onChange={e => setFormData({...formData, size: e.target.value})} className="input-field w-20" />
                <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="input-field">
                  <option value="BUY">BUY</option>
                  <option value="SELL">SELL</option>
                  <option value="CALL">CALL</option>
                  <option value="PUT">PUT</option>
                </select>
                <input type="number" step="any" placeholder="P&L ($)" value={formData.pnl} onChange={e => setFormData({...formData, pnl: e.target.value})} className="input-field w-24" />
                <select value={formData.emotion} onChange={e => setFormData({...formData, emotion: e.target.value})} className="input-field">
                  <option value="Focus">Focus</option>
                  <option value="Anxiety">Anxiety</option>
                  <option value="Hesitation">Hesitation</option>
                </select>
                <button type="submit" className="bg-emerald-500 hover:bg-emerald-400 text-black font-bold px-4 py-2 text-xs rounded transition-all ml-auto">LOG TRADE</button>
              </form>

              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div className="lg:col-span-3 glass-panel rounded-lg p-4 overflow-x-auto">
                  <table className="w-full text-left text-xs text-gray-300 border-collapse">
                    <thead className="border-b border-gray-800 text-gray-400">
                      <tr>
                        <th className="p-3">Status</th>
                        <th className="p-3">Entered</th>
                        <th className="p-3">Symbol</th>
                        <th className="p-3">Entry</th>
                        <th className="p-3">Exit</th>
                        <th className="p-3">Size</th>
                        <th className="p-3">Type</th>
                        <th className="p-3">Return $</th>
                      </tr>
                    </thead>
                    <tbody>
                      {trades.length === 0 ? (
                        <tr><td colSpan="8" className="p-8 text-center text-gray-500">No trades recorded yet. Log your first execution above!</td></tr>
                      ) : (
                        trades.map(t => {
                          const isWin = Number(t.pnl) >= 0;
                          return (
                            <tr key={t.id} className="border-b border-gray-800/50 hover:bg-white/5">
                              <td className="p-3">
                                <span className={`px-2 py-1 rounded text-[10px] font-bold ${isWin ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`}>
                                  {isWin ? 'WIN' : 'LOSS'}
                                </span>
                              </td>
                              <td className="p-3">{t.date || 'N/A'}</td>
                              <td className="p-3 font-semibold text-white">{t.symbol}</td>
                              <td className="p-3">${t.entry || '0'}</td>
                              <td className="p-3">${t.exit || '0'}</td>
                              <td className="p-3">{t.size || '0'}</td>
                              <td className="p-3 text-gray-400">{t.type || 'BUY'}</td>
                              <td className={`p-3 font-semibold ${isWin ? 'neon-green' : 'neon-red'}`}>
                                ${t.pnl || '0.00'}
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>

                <div className="glass-panel p-4 rounded-lg flex flex-col justify-between space-y-4">
                  <h3 className="text-xs font-bold text-gray-400 uppercase border-b border-gray-800 pb-2">Successful Rate</h3>
                  <div className="flex flex-col items-center justify-center py-4">
                    <div className="text-4xl font-extrabold">{winRate}%</div>
                    <div className="flex gap-4 text-xs mt-3">
                      <span className="text-emerald-400 font-medium">● Wins: {wins}</span>
                      <span className="text-red-400 font-medium">● Losses: {losses}</span>
                    </div>
                  </div>
                  <div className="bg-black/40 p-3 rounded border border-gray-800">
                    <p className="text-[10px] text-gray-500 uppercase">Total Net Return</p>
                    <p className={`text-xl font-bold ${totalPnl >= 0 ? 'neon-green' : 'neon-red'}`}>${totalPnl.toFixed(2)}</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* BEHAVIORAL TAB */}
          {activeTab === 'behavioral' && (
            <div className="space-y-6">
              <h2 className="text-lg font-bold tracking-wide border-b border-gray-800 pb-3">Behavioral Edge Analytics</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {['Focus', 'Anxiety', 'Hesitation'].map((emotionKey) => {
                  const filtered = trades.filter(t => t.emotion === emotionKey);
                  const count = filtered.length;
                  const emotionWins = filtered.filter(t => Number(t.pnl) > 0).length;
                  const emotionWinRate = count > 0 ? Math.round((emotionWins / count) * 100) : 0;
                  const netPnl = filtered.reduce((acc, t) => acc + Number(t.pnl || 0), 0);

                  return (
                    <div key={emotionKey} className="glass-panel p-5 rounded-lg space-y-4">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold tracking-widest text-gray-400 uppercase">{emotionKey}</span>
                        <span className="text-[10px] text-gray-500 bg-black/50 px-2 py-0.5 rounded">{count} Trades</span>
                      </div>
                      <div className="space-y-1">
                        <div className="flex justify-between text-xs">
                          <span className="text-gray-400">Win Rate</span>
                          <span className="font-bold text-emerald-400">{emotionWinRate}%</span>
                        </div>
                        <div className="w-full bg-black/60 rounded-full h-1.5 overflow-hidden">
                          <div className="h-full bg-emerald-500" style={{ width: `${emotionWinRate}%` }}></div>
                        </div>
                      </div>
                      <div className="pt-2 border-t border-gray-800 flex justify-between items-center text-xs">
                        <span className="text-gray-500">Net Impact</span>
                        <span className={`font-mono font-bold ${netPnl >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                          ${netPnl.toFixed(2)}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* SPLIT JOURNAL TAB */}
          {activeTab === 'journal' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="glass-panel p-6 rounded-lg space-y-3">
                <h3 className="text-sm font-bold text-emerald-400 border-b border-gray-800 pb-2">📈 Market & Session Context</h3>
                <textarea 
                  value={marketNotes} 
                  onChange={e => { setMarketNotes(e.target.value); localStorage.setItem('market_notes', e.target.value); }} 
                  placeholder="Record key market levels, setup invalidation points, key news releases..." 
                  className="w-full h-72 bg-black/50 border border-gray-800 p-3 text-xs text-gray-200 rounded focus:border-emerald-500 focus:outline-none resize-none font-mono"
                ></textarea>
              </div>

              <div className="glass-panel p-6 rounded-lg space-y-3">
                <h3 className="text-sm font-bold text-purple-400 border-b border-gray-800 pb-2">🧠 Personal Mindset & Reflections</h3>
                <textarea 
                  value={personalNotes} 
                  onChange={e => { setPersonalNotes(e.target.value); localStorage.setItem('personal_notes', e.target.value); }} 
                  placeholder="Write personal thoughts, emotional reflections, fatigue levels, or non-market notes..." 
                  className="w-full h-72 bg-black/50 border border-gray-800 p-3 text-xs text-gray-200 rounded focus:border-purple-500 focus:outline-none resize-none font-mono"
                ></textarea>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
